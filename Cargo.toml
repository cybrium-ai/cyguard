[package]
name = "cyguard"
version = "0.1.0"
edition = "2021"
authors = ["Cybrium AI <hello@cybrium.ai>"]
description = "Lightweight endpoint security agent — process, network, software inventory for IT/OT environments"
license = "MIT"
repository = "https://github.com/cybrium-ai/cyguard"

[[bin]]
name = "cyguard"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs = "5"
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
